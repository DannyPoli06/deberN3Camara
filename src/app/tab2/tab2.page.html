<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      Cámara
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ion-text-center">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Cámara</ion-title>
    </ion-toolbar>
  </ion-header>

  <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 70vh;">
    <ion-card style="width: 100%; max-width: 350px;">
      <ion-card-header>
        <ion-card-title>Tomar una nueva foto</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>Presiona el botón para abrir la cámara del dispositivo y guardar una nueva imagen en tu galería.</p>
        
        <br />

        <ion-button expand="block" color="primary" (click)="takePhoto()">
          <ion-icon slot="start" name="camera"></ion-icon>
          Abrir Cámara
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Botón flotante opcional abajo al centro -->
  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button (click)="takePhoto()" color="secondary">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
