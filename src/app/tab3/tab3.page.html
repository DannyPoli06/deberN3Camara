<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      Estadísticas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Estadísticas</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Tarjeta principal del contador -->
  <ion-card class="ion-text-center">
    <ion-card-header>
      <ion-card-subtitle>Resumen de almacenamiento</ion-card-subtitle>
      <ion-card-title style="font-size: 2rem; margin-top: 10px;">
        <ion-icon name="images" color="primary" style="vertical-align: middle; margin-right: 8px;"></ion-icon>
        {{ photoService.photos().length }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <p>Fotos registradas en la aplicación</p>
    </ion-card-content>
  </ion-card>

  <!-- Detalles adicionales -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Información de la App</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-icon name="camera" slot="start" color="secondary"></ion-icon>
          <ion-label>
            <h3>Estado de Cámara</h3>
            <p>Plugin Capacitor Activo</p>
          </ion-label>
          <ion-badge color="success" slot="end">OK</ion-badge>
        </ion-item>

        <ion-item>
          <ion-icon name="information-circle" slot="start" color="tertiary"></ion-icon>
          <ion-label>
            <h3>Almacenamiento</h3>
            <p>Galería Local + Preferences</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>
</ion-content>
